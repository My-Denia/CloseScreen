[workspace]
resolver = "2"
members = ["protocol", "cursor-sampler", "wgc-capture"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

# Release builds stage binaries into electron/native/bin/<arch>/; the directory
# is generated and packaged rather than committed. Keep binaries small and make any panic kill the helper process (the Electron side
# treats a dead helper as a failed recording — a half-alive helper is worse).
[profile.release]
panic = "abort"
lto = "thin"
strip = "symbols"
