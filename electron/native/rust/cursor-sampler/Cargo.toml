[package]
name = "cursor-sampler"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "cursor-sampler"
path = "src/main.rs"

[dependencies]
closescreen-native-protocol = { path = "../protocol" }
base64 = "0.22"
png = "0.17"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
]

[lints]
workspace = true
