name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: Verify tag matches version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME ($TAG) does not match package.json version ($PKG)"
            exit 1
          fi
          echo "Tag matches package.json version: $PKG"

  build-windows:
    name: Build Windows Installer
    needs: verify-version
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache caption assets
        uses: actions/cache@v5
        with:
          path: caption-assets
          key: caption-assets-${{ hashFiles('scripts/fetch-caption-model.mjs') }}

      - name: Build native Windows helpers
        run: npm run build:native:win

      - name: Build Vite output
        run: npm run build-vite

      - name: Package Windows installer
        run: npx electron-builder --win --config.npmRebuild=false --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: release/**/*Setup*.exe
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Build Linux Installers
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pacman build dependencies
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Cache caption assets
        uses: actions/cache@v5
        with:
          path: caption-assets
          key: caption-assets-${{ hashFiles('scripts/fetch-caption-model.mjs') }}

      - name: Build Vite output
        run: npm run build-vite

      - name: Package Linux installers
        run: npx electron-builder --linux AppImage deb pacman --config.npmRebuild=false --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Linux installers
        uses: actions/upload-artifact@v7
        with:
          name: linux-installers
          path: |
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.pacman
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v6

      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(
            artifacts/windows-installer/**/*.exe
            artifacts/linux-installers/**/*.AppImage
            artifacts/linux-installers/**/*.deb
            artifacts/linux-installers/**/*.pacman
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No release assets found for checksum generation"
            exit 1
          fi
          : > SHA256SUMS.txt
          for file in "${files[@]}"; do
            hash="$(sha256sum "$file" | awk '{print $1}')"
            printf '%s  %s\n' "$hash" "$(basename "$file")" >> SHA256SUMS.txt
          done
          sort -k2 SHA256SUMS.txt -o SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          body_path: docs/releases/v1.5.0-fork.2.md
          generate_release_notes: true
          prerelease: false
          make_latest: "true"
          files: |
            artifacts/windows-installer/**/*.exe
            artifacts/linux-installers/**/*.AppImage
            artifacts/linux-installers/**/*.deb
            artifacts/linux-installers/**/*.pacman
            SHA256SUMS.txt
