name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    name: Verify tag matches version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
      - name: Assert checked-out source
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME ($TAG) does not match package.json version ($PKG)"
            exit 1
          fi
          echo "Tag matches package.json version: $PKG"

  build-windows:
    name: Build Windows Installer
    needs: verify-version
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}

      - name: Assert checked-out source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne "${{ github.sha }}") {
            throw "Checked-out source does not match the workflow event SHA"
          }

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup target add x86_64-pc-windows-msvc --toolchain 1.96.1

      - name: Cache caption assets
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: caption-assets
          key: caption-assets-${{ runner.os }}-${{ hashFiles('scripts/caption-assets-manifest.json', 'scripts/fetch-caption-model.mjs', 'package-lock.json') }}

      - name: Build native Windows helpers
        run: npm run build:native:win

      - name: Build Vite output
        run: npm run build-vite

      - name: Package Windows installer
        run: npx electron-builder --win --config.npmRebuild=false --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify packaged native payload
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          node scripts/verify-windows-native-payload.mjs --resources "release/$version/win-unpacked/resources"

      - name: Record Windows build provenance
        run: node scripts/write-build-provenance.mjs --platform windows --output release-provenance/windows-build-provenance.json

      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-installer
          path: |
            release/**/*Setup*.exe
            !release/**/*.__uninstaller.exe
            release-provenance/windows-build-provenance.json
          if-no-files-found: error
          retention-days: 30

  build-linux:
    name: Build Linux Installers
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}

      - name: Assert checked-out source
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pacman build dependencies
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Cache caption assets
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: caption-assets
          key: caption-assets-${{ runner.os }}-${{ hashFiles('scripts/caption-assets-manifest.json', 'scripts/fetch-caption-model.mjs', 'package-lock.json') }}

      - name: Build Vite output
        run: npm run build-vite

      - name: Package Linux installers
        run: npx electron-builder --linux AppImage deb pacman --config.npmRebuild=false --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Record Linux build provenance
        run: node scripts/write-build-provenance.mjs --platform linux --output release-provenance/linux-build-provenance.json

      - name: Upload Linux installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-installers
          path: |
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.pacman
            release-provenance/linux-build-provenance.json
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}

      - name: Assert checked-out source
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc

      - name: Download installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Stage and verify final release assets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-release-assets.mjs --artifacts artifacts --output release-assets
          cd release-assets
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Verify release notes exist
        shell: bash
        run: test -f "docs/releases/${GITHUB_REF_NAME}.md"

      - name: Publish release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          body_path: docs/releases/${{ github.ref_name }}.md
          generate_release_notes: true
          prerelease: false
          make_latest: "true"
          files: release-assets/*
